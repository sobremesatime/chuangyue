# 窗月 · 搜索服务（关键词 + 分类检索）
#
# 不持有业务表：按「任何服务都不直连他人数据库」的约定，检索数据来自自己维护的 ES 索引
# （由视频变更事件异步追平）或视频服务的库内检索；命中的卡片字段经视频服务 gRPC 补全。
# search.es.enabled=false 或 ES 不可用时自动退回库内 LIKE，对外契约不变。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: chuangyue
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: chuangyue
    spec:
      terminationGracePeriodSeconds: 30
      # 拉取私有 GHCR 镜像的凭据，由部署者预先创建的 Secret 提供（见 deploy/k8s/README）。
      # 该 Secret 不存在也不会阻止 Pod 启动——只是私有仓库会 ImagePullBackOff；把 8 个包设为 public 时无需它。
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: search
          image: chuangyue/search
          imagePullPolicy: IfNotPresent
          args: ["-c", "/app/config.yaml", "-addr", ":9105", "-advertise", "$(POD_IP):9105", "-metrics-addr", ":9205"]
          ports:
            - name: grpc
              containerPort: 9105
            # Prometheus 抓取端口（配合 PodMonitor / 注解抓取）
            - name: metrics
              containerPort: 9205
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: chuangyue-secrets
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: chuangyue-config
---
apiVersion: v1
kind: Service
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: chuangyue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: search
  ports:
    - name: grpc
      port: 9105
      targetPort: grpc
