# 窗月 · 互动服务（点赞 / 收藏 / 评论 / 弹幕 / 通知 / 「我」列表 / 互动计数）
#
# 物理拆库后只连**自己的库**（interaction_mysql → chuangyue_interaction，专用账号），
# 需要视频信息时经 gRPC 调 video（不再直读视频表）。
# 点赞 / 收藏计数的真源在互动库 video_stat；改完经 Kafka 回写视频库的只读副本（供热排序）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interaction
  labels:
    app.kubernetes.io/name: interaction
    app.kubernetes.io/part-of: chuangyue
    app.kubernetes.io/component: interaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: interaction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: interaction
        app.kubernetes.io/part-of: chuangyue
    spec:
      terminationGracePeriodSeconds: 30
      # 拉取私有 GHCR 镜像的凭据，由部署者预先创建的 Secret 提供（见 deploy/k8s/README）。
      # 该 Secret 不存在也不会阻止 Pod 启动——只是私有仓库会 ImagePullBackOff；把 8 个包设为 public 时无需它。
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: interaction
          image: chuangyue/interaction
          imagePullPolicy: IfNotPresent
          args: ["-c", "/app/config.yaml", "-addr", ":9101", "-advertise", "$(POD_IP):9101", "-metrics-addr", ":9201"]
          ports:
            - name: grpc
              containerPort: 9101
            # Prometheus 抓取端口（配合 PodMonitor / 注解抓取）
            - name: metrics
              containerPort: 9201
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: chuangyue-secrets
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: chuangyue-config
---
apiVersion: v1
kind: Service
metadata:
  name: interaction
  labels:
    app.kubernetes.io/name: interaction
    app.kubernetes.io/part-of: chuangyue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: interaction
  ports:
    - name: grpc
      port: 9101
      targetPort: grpc
