# 窗月 · K8s 生产环境 overlay
#
# 与 base 的差异：
#   - 副本数：无状态服务各 2 副本（滚动更新时零停机）；转码 Worker 保持 1（CPU 密集）
#   - 配置：叠加 prod/config.yaml（env=prod、JSON 日志、连接池调大）
#   - 资源：统一抬高 requests/limits（转码 Worker 单独保留高 CPU 档）
#   - 入口：新增 Ingress 指向**接入层 web**（前端静态 + /api 反代），网关仅在集群内可达
#
# 用法（在仓库根目录）：
#   kubectl apply -k deploy/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chuangyue

resources:
  - ../../base
  - ingress.yaml
  # MinIO 的对外入口（路径 /chuangyue → minio-s3:9000）。
  # 与 ../../infra 的 minio.yaml 必须**同时**启用/停用：
  # 只开本体不开入口 → 封面 / 头像的绝对地址 404；
  # 只开入口不开本体 → Traefik 持续报后端不存在。
  - minio-ingress.yaml

# 副本数：全部 1。
# 本项目定位是单机规模上线，中间件（MySQL / Redis / Etcd / Kafka）均为单实例，
# 应用层配多副本并不能消除单点——中间件一挂全站照样停，只是白占资源
# （web/interaction/feed/search 各 2 副本会多吃约 620m CPU / 800Mi 内存）。
# 代价：发版滚动更新期间入口会有几秒中断，可接受。
# 想恢复零停机滚动更新时，把无状态服务（web/interaction/feed/search）调回 2 即可。
replicas:
  - name: web
    count: 1
  - name: gateway
    count: 1
  - name: user
    count: 1
  - name: video
    count: 1
  - name: interaction
    count: 1
  - name: feed
    count: 1
  - name: search
    count: 1
  - name: transcode-worker
    count: 1

# 镜像：统一指向 GHCR（由 .github/workflows/release.yml 在推 v1.0.0 标签时打出同名版本标签）。
# GHCR 包默认私有，集群拉取需要 imagePullSecret（见 deploy/k8s/README.md）。
images:
  - name: chuangyue/web
    newName: ghcr.io/sobremesatime/chuangyue/web
    newTag: "1.0.1"
  - name: chuangyue/gateway
    newName: ghcr.io/sobremesatime/chuangyue/gateway
    newTag: "1.0.1"
  - name: chuangyue/user
    newName: ghcr.io/sobremesatime/chuangyue/user
    newTag: "1.0.1"
  - name: chuangyue/video
    newName: ghcr.io/sobremesatime/chuangyue/video
    newTag: "1.0.1"
  - name: chuangyue/interaction
    newName: ghcr.io/sobremesatime/chuangyue/interaction
    newTag: "1.0.1"
  - name: chuangyue/feed
    newName: ghcr.io/sobremesatime/chuangyue/feed
    newTag: "1.0.1"
  - name: chuangyue/search
    newName: ghcr.io/sobremesatime/chuangyue/search
    newTag: "1.0.1"
  - name: chuangyue/transcode-worker
    newName: ghcr.io/sobremesatime/chuangyue/transcode-worker
    newTag: "1.0.1"

# 覆盖 base 的 config.yaml（behavior: merge 只替换同名 key）
configMapGenerator:
  - name: chuangyue-config
    behavior: merge
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true

patches:
  # 上传共享卷改为「节点本地」：k3s 只有 local-path（RWO）。
  # 有真正的 RWX 存储时删掉这一段与下面四条节点固定补丁；细节与代价见 local-storage.yaml 文件头。
  - path: local-storage.yaml
  # 四个用到上传卷的 Deployment 必须落在同一节点（RWO 的共享前提），否则会因卷已被
  # 其它节点挂载而 Pending。这里用「一次一个文档」的内联补丁而不是多文档文件，
  # 因为 kustomize v5.0.x 无法解析多文档补丁（CI 曾因此报 unable to parse SM or JSON patch）。
  - target: { kind: Deployment, name: user }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: video }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: transcode-worker }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  # ⚠️ user 的 nodeSelector 保留：切到 minio 后它不再需要上传卷，但**仍钉在 node-2**。
  # 理由是确定性优先——node-2 同时有 gateway，两者之间是高频 gRPC 调用，同机走回环；
  # 且 node-1（~77% CPU）与 node-3（~69% 内存）都不如 node-2（~66% / ~64%）宽松。
  # 真正的收益是下面这组补丁：去掉 uploads 卷挂载后，user 不再依赖 `chuangyue-uploads`，
  # 即使那块 PVC 出问题也不影响用户服务启动。
  # 想让它彻底可漂移时，把上面 user 的 nodeSelector 补丁删掉即可（三节点都放得下）。
  - target: { kind: Deployment, name: user }
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/volumes/1
  # feed 固定到 node-1（tier=core）：它纯无状态、不碰上传卷，放控制面节点可以避开
  # node-2 的内存压力（那里有 Kafka / 转码 / 两个卷 Pod，且还要留给 MinIO）。
  - target: { kind: Deployment, name: feed }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/tier: "core" }
  # interaction / search 也迁到 node-1。
  # 原因：node-3 只有 1.9Gi，装完 Elasticsearch（requests 768Mi，实际约 1Gi）后
  # 只剩约 600Mi，再放两个 256Mi 的应用就到 ~97%，任何一次重建都可能 Pending。
  # 而 node-1 有 3.5Gi、CPU 实际只用 4%，是全集群最有余量的节点。
  # 代价是 node-1 的 CPU requests 到 ~77%，但 CPU 是可压缩资源（超了只是变慢），
  # 不像内存一超就 Pending / OOM，因此把「内存余量」留给不可压缩的这一侧更划算。
  - target: { kind: Deployment, name: interaction }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/tier: "core" }
  - target: { kind: Deployment, name: search }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/tier: "core" }
  # 无状态服务统一抬高资源档
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  # 转码 Worker 是 CPU 密集型，单独保留高 limits（避免被上面的通用 patch 压低）。
  # requests 只给 250m：它是突发型负载，1 核的「预留」会把 node-2 挤爆——
  # node-2 同时承载 ES(100m)+Kafka(300m)+gateway/user/feed(各 200m)+video(200m)，
  # 加上转码的 1000m 正好超出 2 核可分配量，video 会永久 Pending。
  # limits 保持 4 核：真正转码时仍能跑满，只是不再向调度器「霸占」额度。
  - target:
      kind: Deployment
      name: transcode-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 2Gi
