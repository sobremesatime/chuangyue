# 窗月 · K8s 生产环境 overlay
#
# 与 base 的差异：
#   - 副本数：无状态服务各 2 副本（滚动更新时零停机）；转码 Worker 保持 1（CPU 密集）
#   - 配置：叠加 prod/config.yaml（env=prod、JSON 日志、连接池调大）
#   - 资源：统一抬高 requests/limits（转码 Worker 单独保留高 CPU 档）
#   - 入口：新增 Ingress 指向**接入层 web**（前端静态 + /api 反代），网关仅在集群内可达
#
# 用法（在仓库根目录）：
#   kubectl apply -k deploy/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chuangyue

resources:
  - ../../base
  - ingress.yaml

# 副本数：无状态服务（web / interaction / feed / search）可安全跑 2 副本做滚动更新零停机。
# gateway / user / video 因共用 RWO 上传卷、被钉在同一节点（node-2），2 副本既无法跨节点高可用、
# 又会挤爆单台 2C 机器的 CPU requests，故固定 1 副本（横向扩容的前提是换 RWX 存储 + 去掉节点 pin）。
replicas:
  - name: web
    count: 2
  - name: gateway
    count: 1
  - name: user
    count: 1
  - name: video
    count: 1
  - name: interaction
    count: 2
  - name: feed
    count: 2
  - name: search
    count: 2
  - name: transcode-worker
    count: 1

# 镜像：统一指向 GHCR（由 .github/workflows/release.yml 在推 v1.0.0 标签时打出同名版本标签）。
# GHCR 包默认私有，集群拉取需要 imagePullSecret（见 deploy/k8s/README.md）。
images:
  - name: chuangyue/web
    newName: ghcr.io/sobremesatime/chuangyue/web
    newTag: "1.0.0"
  - name: chuangyue/gateway
    newName: ghcr.io/sobremesatime/chuangyue/gateway
    newTag: "1.0.0"
  - name: chuangyue/user
    newName: ghcr.io/sobremesatime/chuangyue/user
    newTag: "1.0.0"
  - name: chuangyue/video
    newName: ghcr.io/sobremesatime/chuangyue/video
    newTag: "1.0.0"
  - name: chuangyue/interaction
    newName: ghcr.io/sobremesatime/chuangyue/interaction
    newTag: "1.0.0"
  - name: chuangyue/feed
    newName: ghcr.io/sobremesatime/chuangyue/feed
    newTag: "1.0.0"
  - name: chuangyue/search
    newName: ghcr.io/sobremesatime/chuangyue/search
    newTag: "1.0.0"
  - name: chuangyue/transcode-worker
    newName: ghcr.io/sobremesatime/chuangyue/transcode-worker
    newTag: "1.0.0"

# 覆盖 base 的 config.yaml（behavior: merge 只替换同名 key）
configMapGenerator:
  - name: chuangyue-config
    behavior: merge
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true

patches:
  # 上传共享卷改为「节点本地」：k3s 只有 local-path（RWO）。
  # 有真正的 RWX 存储时删掉这一段与下面四条节点固定补丁；细节与代价见 local-storage.yaml 文件头。
  - path: local-storage.yaml
  # 四个用到上传卷的 Deployment 必须落在同一节点（RWO 的共享前提），否则会因卷已被
  # 其它节点挂载而 Pending。这里用「一次一个文档」的内联补丁而不是多文档文件，
  # 因为 kustomize v5.0.x 无法解析多文档补丁（CI 曾因此报 unable to parse SM or JSON patch）。
  - target: { kind: Deployment, name: user }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: video }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  - target: { kind: Deployment, name: transcode-worker }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
  # 无状态服务统一抬高资源档
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  # 转码 Worker 是 CPU 密集型，单独保留高 CPU 档（避免被上面的通用 patch 压低）
  - target:
      kind: Deployment
      name: transcode-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 2Gi
