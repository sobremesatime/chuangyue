# 窗月 · 自建中间件（MySQL / Redis / Etcd / Kafka / MinIO 全部自建）
#
# 用途：给**自建集群**（3 节点 k3s）准备 MySQL / Redis / Etcd / Kafka / MinIO / Elasticsearch。
# 它们全部由本目录的清单自建承载，不依赖任何云托管中间件（RDS / 云 Redis / 云 Kafka / OSS 等）。
# 其中 **Etcd 是服务注册与发现的中心**——缺了它各服务注册不上、网关发现不到后端，
# 因此它是必须最先确保就绪的一项。
#
# Elasticsearch 是可选的检索后端：不部署时搜索服务会自动退回视频服务的库内 LIKE，
# 只是失去相关度排序与中文短语匹配。内存紧张的单机可以把它从 resources 里去掉。
#
# 为什么单独成一个 kustomization 而不是并进 base：
#   - 应用与中间件关注点不同：应用是业务逻辑、中间件是基础设施，分开更清晰；
#   - 应用清单和中间件清单的发布节奏不同（应用天天发，中间件半年不动）。
#
# 存储：全部用**集群默认 StorageClass**（k3s 自带 local-path）。
# 单实例 StatefulSet + 节点本地卷意味着「Pod 迁到别的节点就看不到旧数据」——
# 这是刻意接受的最小成本方案：演示集群的中间件本来就没打算跨节点漂移。
# 要更强的可用性，请改用带副本的 Operator。
#
# 容量声明（mysql 10Gi / redis 2Gi / etcd 2Gi / kafka 5Gi / minio 20Gi / es 10Gi）是**逻辑预留**：
# local-path 只会在节点上建目录、不校验容量，所以磁盘 60G 的演示机也能跑起来；
# 若换成会校验容量的 CSI，请按实际磁盘重新分配（再加上应用侧的 uploads 卷 50Gi）。
#
# 用法（在仓库根目录，**先于**应用 overlay 执行）：
#   kubectl apply -k deploy/k8s/infra
#
# 前提：Secret `chuangyue-secrets` 必须已存在（MySQL / Redis / MinIO 的口令从这里取），
# 创建方式见 ../README.md「配置与密钥」。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chuangyue

resources:
  - namespace.yaml
  - mysql.yaml
  - redis.yaml
  - etcd.yaml
  - kafka.yaml
  # MinIO：视频源文件 / 封面 / 头像的对象存储（upload.driver=minio）。
  # 与 prod overlay 的 minio-ingress.yaml 必须同时启用/停用。
  - minio.yaml
  # Elasticsearch：生产已启用（prod/config.yaml 里 search.es.enabled=true），
  # 关键词检索走 ES 索引（分词 + 相关度排序），索引由 Kafka 事件维护。
  # 若将来要关掉：注释本行 + 把 config 的 search.es.enabled 改回 false，
  # 搜索会自动退回视频库的 LIKE，功能不中断。
  - elasticsearch.yaml
  #
  # ⚠️ 凡是注释掉某一项，只是「以后不再 apply」，**不会删除已存在的 StatefulSet / PVC**。
  # 例如要停用 MinIO，除了注释 minio.yaml，还要手工清理一次：
  #   kubectl -n chuangyue delete statefulset minio
  #   kubectl -n chuangyue delete pvc data-minio-0

# 节点分配：ES 固定到 node-3（打 tier=edge 标签）。
# ES 是 node-3 上最重的组件（requests 768Mi、实际约 1Gi），因此 node-3 只留
# web / redis / etcd 陪它；interaction 与 search 已由 prod overlay 改钉到 node-1。
# ⚠️ dev / 单节点环境没有这个标签，需给唯一节点补打，否则 ES 会 Pending：
#   kubectl label node <节点名> chuangyue.io/tier=edge
patches:
  - target: { kind: StatefulSet, name: elasticsearch }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/tier: "edge" }
  # MinIO 固定到 node-2：与 video / transcode-worker 同机，源文件的读写不跨 VXLAN；
  # node-2 在 ES 与 feed / interaction / search 迁走后有约 1.2Gi 余量，放得下 256Mi。
  - target: { kind: StatefulSet, name: minio }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { chuangyue.io/storage: "true" }
