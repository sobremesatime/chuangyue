# 窗月 · Elasticsearch 8（单节点）
#
# 用途：搜索域的独立检索索引。索引数据全部由 Kafka 上的视频变更事件重建
# （搜索服务启动时若发现索引为空，会从视频服务全量回填），因此它属于
# **可丢弃的派生数据**——不做副本、不做快照也能接受。
#
# 为什么单节点：
#   - 演示规模下检索 QPS 很低，副本带来的读吞吐没有意义；
#   - 多节点意味着 shard 分配、脑裂配置、JVM 堆与磁盘三份预留，运维成本陡增。
# 代价是节点故障期间搜索退回视频服务的库内 LIKE（可用性有退路，只是精度下降）。
#
# 安全：**关闭 xpack.security**。前提是它只在 ClusterIP 内可达；
# 若要把 ES 暴露到集群外，请改用托管 ES 或自行开启 TLS + 认证。
#
# vm.max_map_count：ES 默认使用 mmap 读写索引，要求宿主机 vm.max_map_count >= 262144。
# 这里用 node.store.allow_mmap=false 走普通文件 IO 来绕开该要求（牺牲部分性能），
# 避免为了一个演示用检索索引去跑 privileged initContainer 改宿主机内核参数。
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: chuangyue
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: chuangyue
    app.kubernetes.io/component: search-index
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: chuangyue
    spec:
      terminationGracePeriodSeconds: 60
      # ES 的启动用户是 uid 1000；fsGroup 让 local-path 卷对它有写权限。
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          # 用 DaoCloud 的公共镜像站，而不是官方的 docker.elastic.co。
          #
          # 原因（2026-10-21 实测）：node-3 上从官方域名 `ctr images import` 多架构 tar 后，
          # ctr / crictl 都能列出、`ctr images check` 显示 complete 11/11，但 CRI 的
          # ImageStatus 时灵时不灵 —— 同一个 tag 有时能起（1/1 Running），Pod 重建后又
          # 变成 ErrImageNeverPull。换成从镜像站 `--platform linux/amd64` 拉取后稳定可用。
          #
          # 代价：依赖第三方镜像站。若该站不可用，回退方式有二：
          #   ① 改回 docker.elastic.co + 在每台节点预置镜像（ctr images pull --platform）
          #   ② 用腾讯云 TCR 同步官方镜像到自己仓库，再改这里的地址
          image: elastic.m.daocloud.io/elasticsearch/elasticsearch:8.15.3
          # IfNotPresent + 手动预置：先在节点上把镜像拉好，之后启动直接命中本地副本，
          # 不依赖网络、也不用每次等 642MB。
          #
          # 为什么地址是 daocloud 而不是官方域名：node-3 的 CRI 对本地 tag 的查询不稳定，
          # 实测 `docker.elastic.co/...` 这个 tag 时好时坏（同一镜像、同一 tag，
          # 有时能起、Pod 重建后报 ErrImageNeverPull）；而 daocloud 的 tag 查询正常。
          #
          # 换节点 / 新增节点时的**前置动作**（否则 Pod 会卡在 Pulling）：
          #   sudo k3s ctr images pull --platform linux/amd64 \
          #     elastic.m.daocloud.io/elasticsearch/elasticsearch:8.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: node.store.allow_mmap
              value: "false"
            # 堆固定 512m：容器 limits 1Gi 时，堆 + 元空间 + 直接内存仍有余量；
            # 不固定的话 JVM 会按节点物理内存推算，演示机上容易 OOMKilled。
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
