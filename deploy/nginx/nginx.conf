# 窗月 · 接入层（Nginx）
#
# 职责：① 托管前端静态产物；② 把 /api 与 /uploads 反向代理到网关。
# 同域分发 → 前端无需 CORS，Refresh Token 的 HttpOnly Cookie 也能正常带上。
#
# 这是一份**完整可替换的 nginx.conf**（含 events / http），两种用法都行：
#   - 容器：deploy/nginx/Dockerfile 把它打进镜像（也可在 compose 里直接挂载覆盖）；
#   - 宿主机：直接放到 /etc/nginx/nginx.conf（阿里云方案里 node-2 的用法）。
#
# TLS 是**可选**的，通过下面两个 include 口子挂载（默认目录为空 → 行为与纯 HTTP 完全一致）：
#   /etc/nginx/chuangyue.d/*.conf      （http 上下文）HTTP→HTTPS 跳转等
#   /etc/nginx/chuangyue-tls.d/*.conf  （server 上下文）listen 443 与证书路径
# 示例片段见 deploy/nginx/chuangyue.d/ 与 deploy/nginx/chuangyue-tls.d/。
# 为什么做成 include 而不是直接写死 443：同一份配置要供镜像、宿主机、本地 compose 三处复用，
# 本地没有证书，写死会让本地直接起不来。
#
# 上游 gateway 一律用**服务名**寻址：compose 里是容器名 gateway，K8s 里是 Service 名 gateway。
# 注意 nginx 只在启动时解析一次 upstream 域名，gateway 的服务名必须已存在，
# 否则 nginx 启动失败（K8s 下由 Deployment 的退避重启兜底；清单里另有 initContainer 先等它就绪）。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志带上网关回传的 X-Request-ID，便于与后端日志按同一 ID 串联
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$upstream_http_x_request_id rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 前端产物是 JS / CSS / 字体，gzip 后体积能小一个量级
    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/json application/javascript
                     application/x-javascript text/xml application/xml image/svg+xml;

    # 上传接口允许最大 2048MB（与 upload.max_size_mb 对齐）；
    # 默认 1MB 会让大文件上传在 Nginx 层直接 413，根本到不了网关。
    client_max_body_size 2048m;

    # 与网关保持长连接，避免每个请求都重新握手
    upstream gateway {
        server gateway:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 可选扩展（server 上下文）：TLS 监听与证书；目录为空即不启用
        include /etc/nginx/chuangyue-tls.d/*.conf;

        root   /usr/share/nginx/html;
        index  index.html;

        # 探针 / 负载均衡健康检查用；不写访问日志
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # 带 hash 的构建产物可长期强缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            # 见下面 location = /index.html 处的说明：本 location 自带 add_header 后不再继承
            # server 级头部，因此 HSTS 要在这里显式重复一份
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files $uri =404;
        }

        # 入口页不缓存：否则发版后仍会命中旧的 index.html（引用了已删除的 hash 产物）
        location = /index.html {
            add_header Cache-Control "no-store";
            # HSTS 必须在这里再写一遍：nginx 的 add_header **不继承**——本 location 自带
            # Cache-Control 后，server 级（TLS 片段里）的 HSTS 会被覆盖掉。而这里恰恰是浏览器
            # 首次访问落地的页面（location / 经 try_files 内部回退到本文件），最需要它。
            # 纯 HTTP 下浏览器按 RFC 6797 忽略该头，所以放在这份共享配置里对本地开发无副作用。
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # 前端是 history 路由（createWebHistory），未命中的路径回退到 index.html，否则刷新子路由 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端接口：同域反向代理到网关
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 透传链路 ID；空值时网关会自行生成（见 pkg/middleware/trace.go）
            proxy_set_header   X-Request-ID      $http_x_request_id;

            # 大文件上传：不落盘缓冲、直接透传；放宽读写超时（上传 + HLS 长连接）
            proxy_request_buffering off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }

        # 视频源文件 / 封面 / HLS 产物：由网关静态托管
        location /uploads/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }
    }

    # 可选扩展（http 上下文）：HTTP → HTTPS 跳转 server 块等；目录为空即不启用。
    #
    # 位置刻意放在**主 server 之后**：nginx 把「同一端口上第一个出现的 server」当作该端口的
    # 默认 server，Host 匹配不上任何 server_name 时（例如直接用 IP 访问）都落到它。
    # 若把本 include 放在前面，跳转 server 就会成为 80 端口的默认 server，把 IP 访问也一并跳走。
    # 放在这里，主 server 仍是默认：域名命中跳转块、IP 访问照旧走纯 HTTP。
    include /etc/nginx/chuangyue.d/*.conf;
}
