# 窗月 · Prometheus 告警规则
#
# 与两块 Grafana 看板的关系：看板回答「现在怎么样」，规则回答「什么时候该有人来看」。
# 指标本身不会喊人，规则是把它变成「会响的信号」的那一步。
#
# 规则只使用 `pkg/metrics` 已埋的点，不引入新指标——否则要先补埋点才能谈告警。
# 共五个分组，按「先看哪一类」排序：目标是否活着 → 入口对外是否正常 → 依赖是否拖后腿
# → 进程自身是否健康 → 后台任务是否在跑。
#
# 关于阈值：与限流 / 熔断一样，这里的数值是**按经验定的起点**，不是调优结果。定得准需要真实曲线，
# 做法见 deploy/monitoring/README.md 的「阈值校准」；告警响了先判断是「系统真出问题」
# 还是「阈值过紧」，前者改代码、后者改本文件。
#
# 一个贯穿全篇的写法：**比例类告警都要加最小流量护栏**（`and ... > 0.1`）。
# 低流量路由上「1 个请求里有 1 个 5xx」= 100%，比率会被小样本放大成假警报；
# 护栏要求分母达到约 6 次/分钟才参与判断，宁可晚几分钟发现，也不要天天狼来了。

groups:
  # ============ 1. 可用性：目标是否还在 ============
  #
  # 这是最底层的一条：Prometheus 抓不到 /metrics 意味着「这个进程可能已经没了」。
  # 它也是唯一不需要看业务指标的告警，所以放在最前面——后面所有规则都建立在「目标活着」之上。
  - name: chuangyue-availability
    rules:
      - alert: TargetDown
        # 覆盖 prometheus 自身在内的全部抓取目标。若整个栈都没了，自然也没有人报警，
        # 那属于「外部监控」的职责，不在本进程能力范围内。
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          # 把 job 名映射成 service 标签，是为了与下游依赖类告警对齐维度、让抑制规则能匹配上
          # （见 alertmanager.yml 的 inhibit_rules）。Prometheus 允许在 label 值里做模板展开。
          service: "{{ $labels.job }}"
        annotations:
          summary: "抓取目标 {{ $labels.instance }}（{{ $labels.job }}）掉线"
          description: >-
            已连续 1 分钟抓不到该目标的 /metrics。排查顺序：容器是否在（docker ps）→
            端口是否与 -metrics-addr / compose 端口映射一致 → 进程日志是否已退出。

  # ============ 2. 入口：对外表现是否正常 ============
  #
  # 这三条都只统计网关（HTTP 指标只在网关产生）。按 path（路由模板）下钻而不是只看全局：
  # 全局错误率被健康接口一稀释就看不见问题了，而「哪个路由在坏」才是能直接动手的信息。
  - name: chuangyue-gateway
    rules:
      - alert: GatewayHighErrorRate
        # 5xx 占比 > 5%。只统计 5xx：4xx（含 429）是「系统主动拒绝」，属于保护措施在正常工作，
        # 由下面的限流告警单独盯，混在一起会让错误率失去意义。
        expr: |
          (
            sum by (path) (rate(chuangyue_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum by (path) (rate(chuangyue_http_requests_total[5m])), 1e-9) > 0.05
          )
          and
          (
            sum by (path) (rate(chuangyue_http_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "网关路由 {{ $labels.path }} 5xx 占比超 5%"
          description: >-
            该路由近 5 分钟的服务端错误率已持续超阈值。先看「网关总览」的 QPS 按状态码分布确认
            是不是 503（熔断 / 下游不可用），再顺着 trace_id 到 Jaeger 看是哪一跳在报错。

      - alert: GatewayHighLatency
        # P99 超 1s。参照系是跨服务调用的 5s 上限：P99 过 1s 说明已有相当一部分请求在超时边缘，
        # 此时再看「保护措施」看板的出站 P99，能看出慢在自身还是在下游。
        expr: |
          (
            histogram_quantile(0.99,
              sum by (le, path) (rate(chuangyue_http_request_duration_seconds_bucket[5m]))
            ) > 1
          )
          and
          (
            sum by (path) (rate(chuangyue_http_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关路由 {{ $labels.path }} P99 超过 1s"
          description: >-
            慢请求已持续 5 分钟。用 /debug/pprof 看是否卡在 CPU 或锁上，用 Jaeger 看是哪一跳占了大头；
            若是下游整体变慢，考虑把该下游的熔断阈值调紧，先止损再定位。

      - alert: RateLimitRejectionHigh
        # 被限流拒绝的比例 > 20%。这条告警的落点不是「有攻击」，而是**阈值可能需要调**：
        # 压测里 200 rps 打出 89.7% 拒绝是预期的，但线上持续 20% 就意味着有正常用户在吃 429。
        # 按 dimension 分开（ip / user）——两者对应用户「换个 IP 就能绕过」与「账号被限」两种完全不同的处置。
        expr: |
          (
            sum by (dimension) (rate(chuangyue_ratelimit_rejected_total[5m]))
            / clamp_min(sum(rate(chuangyue_http_requests_total[5m])), 1e-9) > 0.2
          )
          and
          (
            sum(rate(chuangyue_http_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "限流拒绝比例偏高（维度 {{ $labels.dimension }}）"
          description: >-
            近 5 分钟超过 20% 的请求被限流挡回。先确认是异常流量（单 IP / 单用户刷接口）还是
            阈值过紧（正常用户也吃 429）；若是后者，调 ratelimit 配置而不是放宽到形同虚设。

  # ============ 3. 依赖：下游是否在拖后腿 ============
  - name: chuangyue-dependency
    rules:
      - alert: CircuitBreakerNotClosed
        # 为什么不是 `== 2`（打开）：熔断器打开后只维持 open_timeout（配置为 10s）就会转入半开，
        # 下游仍不通时再被下一次失败打回打开态——状态在 2 与 1 之间来回跳。
        # 若写成「等 == 2 持续 2 分钟」，这条告警永远不会触发（10s 的窗口撑不到 2 分钟）。
        # 因此判据取「不再完全闭合」（> 0），语义是「这个下游持续不健康」，这才是能等满 2 分钟的现象。
        #
        # 按 service 取 max 的必要性：凡持有 gRPC 客户端的进程都会暴露同一下游的状态
        # （网关、feed、interaction… 各自一份），不聚合会出现多条重复序列，告警也会重复分组。
        expr: max by (service) (chuangyue_breaker_state) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "调用 {{ $labels.service }} 的熔断器未闭合"
          description: >-
            至少一个调用方对 {{ $labels.service }} 的熔断器处于半开或打开状态，说明该下游持续失败。
            若同时有 TargetDown，本条会被抑制（同源告警，看那一条即可）；否则查该下游自身的错误日志。

      - alert: DownstreamCallFailing
        # 出站调用失败率 > 10%，按目标服务下钻。这个指标挂在拦截器链最外层，
        # 统计的是「含重试与熔断后的最终结果」——即调用方视角的真实失败，而不是每一次重试尝试。
        expr: |
          (
            sum by (target) (rate(chuangyue_grpc_client_requests_total{code!="OK"}[5m]))
            / clamp_min(sum by (target) (rate(chuangyue_grpc_client_requests_total[5m])), 1e-9) > 0.1
          )
          and
          (
            sum by (target) (rate(chuangyue_grpc_client_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: warning
          # target → service：指标上的标签叫 target，而抑制规则要按 service 对齐（见 alertmanager.yml），
          # 这里补一个同义标签把两者接上。否则「下游掉线」时这批派生告警不会被抑制，根因照样被淹。
          service: "{{ $labels.target }}"
        annotations:
          summary: "调用 {{ $labels.target }} 的失败率超 10%"
          description: >-
            出站失败率持续偏高。按状态码进一步判断：Unavailable 多为实例摘除 / 重启等瞬时故障
            （已有白名单幂等读重试兜底，持续出现说明下游一直起不来）；DeadlineExceeded 说明下游处理不过来。

      - alert: DownstreamCallSlow
        # 出站 P99 超 3s。参照系是 5s 统一超时：过 3s 说明已经在超时边缘，
        # 再慢一点就会成批变成 DeadlineExceeded——这是「马上要坏」的先行信号，比失败率更早。
        expr: |
          (
            histogram_quantile(0.99,
              sum by (le, target) (rate(chuangyue_grpc_client_request_duration_seconds_bucket[5m]))
            ) > 3
          )
          and
          (
            sum by (target) (rate(chuangyue_grpc_client_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: warning
          # 同 DownstreamCallFailing：补 service 标签，让抑制规则能按服务对齐。
          service: "{{ $labels.target }}"
        annotations:
          summary: "调用 {{ $labels.target }} 的 P99 超过 3s（超时上限 5s）"
          description: >-
            出站耗时已逼近 5s 超时上限（含重试等待）。先看服务端同方法的 P99 做对照：
            服务端也慢 → 下游自身问题；只有出站慢 → 网络 / 排队 / 重试在放大耗时。

  # ============ 4. 运行时：进程自身是否健康 ============
  #
  # 这三条是「与业务无关的兜底」：Go 运行时与进程指标由 client_golang 自动暴露，无需埋点。
  # 阈值相对宽松——目的是抓「量级异常」（协程泄漏、内存膨胀），而不是精确的容量管理。
  - name: chuangyue-runtime
    rules:
      - alert: GoroutineTooMany
        # 本地实测各服务常驻协程为几十个，1000 已是量级上的异常，基本只可能来自泄漏
        # （典型如忘记读 / 关 body、channel 阻塞、ticker 未 Stop）。
        expr: go_goroutines > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 协程数超过 1000"
          description: >-
            协程数持续偏高，疑似泄漏。抓 /debug/pprof/goroutine?debug=2 看阻塞栈，
            对比两个时间点的 profile 找出只增不减的那一类。

      - alert: ProcessMemoryHigh
        # 本地实测各服务 RSS 34–48MB，512MiB 留了十倍余量，只抓「明显膨胀」。
        # 容器内存上限由编排层（compose / K8s）设置，这里不重复表达。
        expr: process_resident_memory_bytes > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 常驻内存超过 512MiB"
          description: >-
            RSS 持续偏高。用 /debug/pprof/heap 对比两个时间点的分配，区分「缓存占用」与「真的持有不放」；
            若伴随协程数上升，两者很可能是同一个泄漏的两面。

  # ============ 5. 后台任务：转码与周期任务是否在跑 ============
  #
  # 这一组补的是前面看不到的盲区：转码 Worker 与周期任务都不经过 HTTP / gRPC，
  # 失败与停摆不会体现在入口错误率或依赖失败率里。
  - name: chuangyue-jobs
    rules:
      - alert: TranscodeFailed
        # 只统计「重试耗尽、状态已落库为失败」的任务。单次失败就会让一个视频停在
        # 「转码失败」等待管理员重试，因此不做比例判断，15 分钟内出现即告警。
        # 15 分钟窗口既覆盖告警抓取间隔，也让一条失败在窗口滑出后自动恢复。
        expr: increase(chuangyue_transcode_jobs_total{result="failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "转码任务最终失败（15 分钟内 {{ $value | humanize }} 个）"
          description: >-
            转码 Worker 的重试已耗尽，相关视频处于「转码失败」状态。先看 Worker 日志里的
            `转码最终失败` 与 FFmpeg 报错，确认是源文件损坏、编码不支持还是磁盘 / 内存不足；
            修复后可在管理后台对该视频执行「重新转码」，无需重新上传。

      - alert: CronJobStalled
        # 判据是「最近一次成功完成距今超过两个周期 + 60s 宽限」，而不是「有没有报错」：
        # 任务可能没有被调度、卡死、或进程被杀，这几种情况都不会产生错误计数。
        #
        # 按 job 取 max 而不是按实例：多副本部署时单飞锁会让一个实例长期拿不到锁、
        # 只记 skipped，另一个实例正常 success；max 聚合后只要有一个实例成功就不告警。
        expr: |
          time() - max by (job) (chuangyue_cron_job_last_success_timestamp_seconds)
            > 2 * max by (job) (chuangyue_cron_job_interval_seconds) + 60
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "定时任务 {{ $labels.job }} 超过两个周期未成功执行"
          description: >-
            该任务最近一次成功完成距今已超过「2 × 调度间隔 + 60s」。先确认对应服务是否在运行
            （TargetDown），再看日志里是否有 `定时任务` 相关错误或 panic；若只有单副本在跑，
            检查单飞锁是否被异常持有（锁会按租期自动回收）。
