name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 测试
        run: go test ./... -race -cover

  manifests:
    name: K8s 清单渲染校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      # kustomize build 纯离线计算，不连集群、不需要任何凭据。
      # 渲染不出错即代表 base + overlay 结构、patch、image 引用都自洽。
      - name: 渲染 dev overlay
        run: kubectl kustomize deploy/k8s/overlays/dev > /dev/null

      - name: 渲染 prod overlay
        run: kubectl kustomize deploy/k8s/overlays/prod > /dev/null

      # infra 与 backup 是首次部署要 apply 的两套**独立**清单（不在 base/overlay 里），
      # 早先没被 CI 覆盖——它们渲染报错会直接把上线卡住，所以一并纳入校验。
      - name: 渲染 infra 中间件清单
        run: kubectl kustomize deploy/k8s/infra > /dev/null

      - name: 渲染 backup 备份清单
        run: kubectl kustomize deploy/k8s/backup > /dev/null

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查前端是否已初始化
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖并构建
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
