name: Release Images

# 构建并推送 8 个镜像到 GHCR（GitHub 容器仓库）。
#
# 触发：
#   - push 到 main         -> 标签 dev + sha-xxxxxxx（供 dev overlay 用）
#   - push 形如 v1.0.0 的标签 -> 标签 1.0.0 + latest（供 prod overlay 用）
#   - 手动触发（workflow_dispatch）-> 同样按分支规则出标签
#
# 凭据：仅用 Actions 内置的 GITHUB_TOKEN，无需额外 Secret（见 packages: write）。
# 镜像地址：ghcr.io/<owner>/chuangyue/<service>，与 overlays 里的 newName 一致。

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/chuangyue

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 后端 7 个服务共用一个 Dockerfile，靠 build arg SERVICE 选择 cmd 子目录
          - name: gateway
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=gateway
          - name: user
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=user
          - name: video
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=video
          - name: interaction
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=interaction
          - name: feed
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=feed
          - name: search
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=search
          - name: transcode-worker
            dockerfile: deploy/docker/Dockerfile
            build_args: SERVICE=transcode-worker
          # 接入层 web 用另一个 Dockerfile（Node 构建前端 -> Nginx 托管），不传 build arg
          - name: web
            dockerfile: deploy/nginx/Dockerfile
            build_args: ''

    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          # 标签规则（逐行，块内不能写 # 注释）：
          #   type=ref,event=branch      -> 分支名，main 分支即 dev
          #   type=semver,pattern={{version}} -> v1.0.0 -> 1.0.0（prod overlay 用的名字）
          #   type=sha                   -> sha-xxxxxxx，便于回滚追溯
          #   type=raw,value=latest      -> 仅 v*.*.* 标签时打 latest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存复用 go mod download / npm ci / 构建层
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
