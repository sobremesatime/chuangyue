syntax = "proto3";

package search.v1;

option go_package = "github.com/sobremesatime/chuangyue/api/gen/search/v1;searchv1";

import "video/v1/video.proto";

// SearchVideosRequest 是视频检索的查询条件。
//
// keyword 与 category_id 是「与」关系：给关键词的同时也可以限定分类；
// category_id 为 0 表示不按分类过滤。
message SearchVideosRequest {
  string keyword     = 1;
  int32  page        = 2;
  int32  page_size   = 3;
  int64  category_id = 4;
}

message SearchVideosResponse {
  repeated video.v1.VideoBrief videos = 1;
  int64 total = 2;
}

// SearchService 提供视频检索。
service SearchService {
  // SearchVideos 按关键词检索已上架视频，并可按分类过滤。
  rpc SearchVideos(SearchVideosRequest) returns (SearchVideosResponse);
}