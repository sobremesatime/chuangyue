<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="窗月">
  <title>窗月 图形标</title>
  <defs>
    <mask id="cy-bite">
      <rect width="64" height="64" fill="white" />
      <circle cx="49.55" cy="14.45" r="14" fill="black" />
    </mask>
  </defs>

  <!-- 窗：星紫窗框，纯色平涂，圆角 26% -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#8B5CF6" />

  <!-- 月：纯白饱满弯月斜挂右上角，凹槽朝夜空 -->
  <circle cx="40" cy="24" r="14" fill="#FFFFFF" mask="url(#cy-bite)" />
</svg>
